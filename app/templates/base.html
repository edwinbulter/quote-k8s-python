<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quote{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
</head>
<body hx-boost="true">
    <div class="app">
        <nav class="button-bar">
            <div class="logo">
                <div class="logo-header">KABULTER</div>
                <div class="logo-main">Quote</div>
            </div>

            {% if current_user %}
                <a class="user-initial" href="/profile" title="{{ current_user.username }}">
                    {{ current_user.username[0]|upper }}
                </a>
            {% endif %}

            {% block sidebar_actions %}{% endblock %}

            {% if current_user %}
                <a class="btn btn-manage" href="/manage">Manage</a>
                <form hx-post="/auth/logout" hx-swap="none">
                    <button type="submit" class="btn btn-signin">Sign Out</button>
                </form>
            {% else %}
                <a class="btn btn-signin" href="/login">Sign In</a>
            {% endif %}
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
