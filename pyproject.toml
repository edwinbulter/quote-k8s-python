[project]
name = "quote-k8s-python"
version = "0.1.0"
description = "Flask + HTMX quote app, packaged as a monolith for a local kind cluster"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "requests>=2.31",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    "RUF012", # mutable class-attribute defaults are fine for Flask config classes
    "BLE001", # health check deliberately catches broadly and reports status
]
